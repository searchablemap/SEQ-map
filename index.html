<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEQ Alternative Education Finder</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --text: #18212f;
      --muted: #475467;
      --line: #d0d5dd;
      --accent: #1266d4;
      --soft: #eef4ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 15px 18px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      padding: 14px;
      background: #fff;
      border-right: 1px solid var(--line);
    }

    .field {
      margin-bottom: 13px;
    }

    label.field-label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    input, select, button {
      font: inherit;
    }

    input[type="text"], select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .pathways {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
    }

    .pathway-option {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 0.82rem;
    }

    .pathway-option input {
      margin-top: 2px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .count {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .content {
      background: #fff;
      min-width: 0;
    }

    .map-section {
      height: 560px;
      position: relative;
      background: #e8edf2;
      border-bottom: 2px solid var(--line);
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #mapStatus {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.8rem;
      max-width: 80%;
      text-align: center;
    }

    .results-section {
      padding: 18px;
      background: #fff;
      min-height: 400px;
    }

    .results-section h2 {
      margin: 0 0 14px;
      font-size: 1.1rem;
    }

    .card {
      background: #fff;
      border: 1px solid #c8d0da;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      color: var(--text);
    }

    .school-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .campus {
      color: var(--accent);
      margin-top: 2px;
      font-size: 0.9rem;
    }

    .meta {
      margin-top: 7px;
      color: #344054;
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .chip {
      display: inline-block;
      background: var(--soft);
      color: #24456b;
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 0.73rem;
    }

    .warning {
      background: #fff1f0;
      color: #8b1e1e;
    }

    details {
      margin-top: 10px;
      border-top: 1px solid #e4e7ec;
      padding-top: 9px;
    }

    summary {
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }

    .detail-block {
      margin-top: 8px;
      font-size: 0.84rem;
      color: #344054;
      line-height: 1.5;
    }

    .detail-block strong {
      color: var(--text);
    }

    .detail-block ul {
      margin: 5px 0 10px 18px;
      padding: 0;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 9px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .error-box {
      border: 1px solid #f0b8b3;
      background: #fff4f2;
      color: #7a271a;
      padding: 12px;
      border-radius: 8px;
    }

    @media (max-width: 800px) {
      .layout {
        display: block;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .map-section {
        height: 430px;
      }

      .results-section {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
<header>
  <h1>SEQ Alternative Education Finder</h1>
</header>

<div class="layout">
  <aside>
    <div class="field">
      <label class="field-label" for="search">Search school, campus, suburb or program</label>
      <input id="search" type="text" placeholder="e.g. Logan, VET, autism, QCE">
    </div>

    <div class="field">
      <label class="field-label" for="year">Year level</label>
      <select id="year">
        <option value="">Any year level</option>
        <option value="0">Prep</option>
        <option value="1">Year 1</option>
        <option value="2">Year 2</option>
        <option value="3">Year 3</option>
        <option value="4">Year 4</option>
        <option value="5">Year 5</option>
        <option value="6">Year 6</option>
        <option value="7">Year 7</option>
        <option value="8">Year 8</option>
        <option value="9">Year 9</option>
        <option value="10">Year 10</option>
        <option value="11">Year 11</option>
        <option value="12">Year 12</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label" for="age">Age</label>
      <select id="age">
        <option value="">Any age</option>
        <option value="4">4</option><option value="5">5</option>
        <option value="6">6</option><option value="7">7</option>
        <option value="8">8</option><option value="9">9</option>
        <option value="10">10</option><option value="11">11</option>
        <option value="12">12</option><option value="13">13</option>
        <option value="14">14</option><option value="15">15</option>
        <option value="16">16</option><option value="17">17</option>
        <option value="18">18</option><option value="19">19</option>
        <option value="20">20</option><option value="21">21</option>
        <option value="22">22</option><option value="23">23</option>
        <option value="24">24</option>
      </select>
    </div>

    <div class="field row">
      <div>
        <label class="field-label" for="area">Area</label>
        <select id="area"><option value="">All areas</option></select>
      </div>
      <div>
        <label class="field-label" for="delivery">Delivery</label>
        <select id="delivery"><option value="">Any delivery</option></select>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="type">School / program type</label>
      <select id="type"><option value="">All types</option></select>
    </div>

    <div class="field">
      <label class="field-label">Pathways & supports</label>
      <div class="pathways">
        <label class="pathway-option"><input type="checkbox" value="QCE">QCE</label>
        <label class="pathway-option"><input type="checkbox" value="VET">VET</label>
        <label class="pathway-option"><input type="checkbox" value="QCIA">QCIA</label>
        <label class="pathway-option"><input type="checkbox" value="University Pathway">University Pathway</label>
        <label class="pathway-option"><input type="checkbox" value="Work Experience">Work Experience</label>
        <label class="pathway-option"><input type="checkbox" value="Apprenticeships/Traineeships">Apprenticeship/Traineeship</label>
      </div>
    </div>

    <div class="buttons">
      <button id="clear" type="button">Clear filters</button>
      <button id="fit" class="primary" type="button">Fit visible pins</button>
    </div>

    <div id="count" class="count">Loading results…</div>
  </aside>

  <main class="content">
    <section class="map-section">
      <div id="map"></div>
      <div id="mapStatus">Loading map…</div>
    </section>

    <section class="results-section">
      <h2>Matching results</h2>
      <div id="results"></div>
    </section>
  </main>
</div>

<script src="schools.js"></script>
<script>
(function () {
  const PATHWAY_FILTERS = [
    'QCE',
    'VET',
    'QCIA',
    'University Pathway',
    'Work Experience',
    'Apprenticeships/Traineeships'
  ];

  const els = {
    search: document.getElementById('search'),
    year: document.getElementById('year'),
    age: document.getElementById('age'),
    area: document.getElementById('area'),
    delivery: document.getElementById('delivery'),
    type: document.getElementById('type'),
    count: document.getElementById('count'),
    results: document.getElementById('results'),
    mapStatus: document.getElementById('mapStatus')
  };

  let map = null;
  let markerLayer = null;
  const markerByIndex = new Map();
  const coordsByIndex = new Map();

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function unique(values) {
    return [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b));
  }

  function addOptions(select, values) {
    unique(values).forEach(value => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });
  }

  function yearText(s) {
    if (s.minYear == null || s.maxYear == null) return '';
    const y = n => n === 0 ? 'Prep' : `Year ${n}`;
    return s.minYear === s.maxYear ? y(s.minYear) : `${y(s.minYear)}–${y(s.maxYear)}`;
  }

  function ageText(s) {
    if (s.minAge == null) return '';
    if (s.maxAge == null) return `Age ${s.minAge}+`;
    return s.minAge === s.maxAge ? `Age ${s.minAge}` : `Ages ${s.minAge}–${s.maxAge}`;
  }

  function ageMatches(s, age) {
    if (age == null) return true;

    if (Array.isArray(s.ageRanges) && s.ageRanges.length) {
      return s.ageRanges.some(range => age >= Number(range[0]) && age <= Number(range[1]));
    }

    if (s.minAge == null) return false;
    if (s.maxAge == null) return age >= s.minAge;
    return age >= s.minAge && age <= s.maxAge;
  }

  function searchText(s) {
    return [
      s.name, s.campus, s.address, s.area, s.type, s.notes, s.warning,
      ...(s.features || []),
      ...(s.programs || []),
      ...(s.details || []),
      ...(s.resources || []).map(r => r.label)
    ].join(' ').toLowerCase();
  }

  function selectedPathways() {
    return [...document.querySelectorAll('.pathways input:checked')].map(cb => cb.value);
  }

  function schoolMatches(s) {
    const q = els.search.value.trim().toLowerCase();
    const year = els.year.value === '' ? null : Number(els.year.value);
    const age = els.age.value === '' ? null : Number(els.age.value);

    if (q && !searchText(s).includes(q)) return false;
    if (year != null && !(s.minYear != null && s.maxYear != null && year >= s.minYear && year <= s.maxYear)) return false;
    if (!ageMatches(s, age)) return false;
    if (els.area.value && s.area !== els.area.value) return false;
    if (els.delivery.value && !(s.delivery || []).includes(els.delivery.value)) return false;
    if (els.type.value && s.type !== els.type.value) return false;

    const requested = selectedPathways();
    if (requested.length && !requested.every(tag => (s.features || []).includes(tag))) return false;

    return true;
  }

  function listHtml(items) {
    if (!items || !items.length) return '';
    return `<ul>${items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>`;
  }

  function resourcesHtml(resources) {
    if (!resources || !resources.length) return '';
    return `<ul>${resources.map(r =>
      `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)} ↗</a></li>`
    ).join('')}</ul>`;
  }

  function feesHtml(fees) {
    if (!fees) return '';

    const items = [];
    if (fees.annualTuition) items.push(`2026 annual tuition: $${Number(fees.annualTuition).toLocaleString()}`);
    if (fees.applicationFee) items.push(`Application fee: $${fees.applicationFee}`);
    if (fees.confirmationFee) items.push(`Enrolment confirmation fee: $${fees.confirmationFee}`);
    if (fees.includes?.length) items.push(`Includes: ${fees.includes.join(', ')}`);
    if (fees.excludes?.length) items.push(`Additional costs may include: ${fees.excludes.join(', ')}`);

    return listHtml(items);
  }

  function mapsUrl(s) {
    return 'https://www.google.com/maps/search/?api=1&query=' +
      encodeURIComponent(s.geocodeQuery || s.address || `${s.name} ${s.campus || ''}`);
  }

  function cardHtml(s) {
    const pathwayChips = (s.features || [])
      .filter(tag => PATHWAY_FILTERS.includes(tag))
      .map(tag => `<span class="chip">${esc(tag === 'Apprenticeships/Traineeships' ? 'Apprenticeship/Traineeship' : tag)}</span>`)
      .join('');

    const basicChips = [
      s.type ? `<span class="chip">${esc(s.type)}</span>` : '',
      yearText(s) ? `<span class="chip">${esc(yearText(s))}</span>` : '',
      ageText(s) ? `<span class="chip">${esc(ageText(s))}</span>` : '',
      s.area ? `<span class="chip">${esc(s.area)}</span>` : '',
      pathwayChips
    ].join('');

    const hasMore =
      (s.programs && s.programs.length) ||
      (s.details && s.details.length) ||
      s.fees ||
      (s.resources && s.resources.length);

    return `
      <div class="school-name">${esc(s.name)}</div>
      ${s.campus ? `<div class="campus">${esc(s.campus)}</div>` : ''}
      ${s.warning ? `<div class="chips"><span class="chip warning">⚠ ${esc(s.warning)}</span></div>` : ''}

      <div class="meta">
        ${s.address ? `${esc(s.address)}<br>` : ''}
        ${s.phone ? `<strong>Phone:</strong> ${esc(s.phone)}<br>` : ''}
        ${s.email ? `<strong>Email:</strong> <a href="mailto:${esc(s.email)}">${esc(s.email)}</a><br>` : ''}
        ${s.notes ? esc(s.notes) : ''}
      </div>

      <div class="chips">${basicChips}</div>

      ${hasMore ? `
        <details>
          <summary>More information</summary>
          <div class="detail-block">
            ${s.programs?.length ? `<strong>Programs & pathways</strong>${listHtml(s.programs)}` : ''}
            ${s.details?.length ? `<strong>Additional information</strong>${listHtml(s.details)}` : ''}
            ${s.fees ? `<strong>Fees</strong>${feesHtml(s.fees)}` : ''}
            ${s.resources?.length ? `<strong>Helpful links</strong>${resourcesHtml(s.resources)}` : ''}
          </div>
        </details>
      ` : ''}

      <div class="links">
        ${s.website ? `<a href="${esc(s.website)}" target="_blank" rel="noopener">Website ↗</a>` : ''}
        ${s.email ? `<a href="mailto:${esc(s.email)}">Email ↗</a>` : ''}
        ${s.mappable !== false ? `<a href="${mapsUrl(s)}" target="_blank" rel="noopener">Google Maps ↗</a>` : ''}
      </div>
    `;
  }

  function visibleIndices() {
    const results = [];
    schools.forEach((s, i) => {
      if (schoolMatches(s)) results.push(i);
    });
    return results;
  }

  function renderResults() {
    const visible = visibleIndices();

    els.count.textContent =
      `${visible.length} matching result${visible.length === 1 ? '' : 's'}` +
      (map ? ` · ${visible.filter(i => coordsByIndex.has(i)).length} map pins` : '');

    els.results.innerHTML = '';

    if (!visible.length) {
      els.results.innerHTML = '<div class="card"><strong>No matching results</strong></div>';
      return;
    }

    visible.forEach(index => {
      const s = schools[index];
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = cardHtml(s);

      if (coordsByIndex.has(index)) {
        card.addEventListener('click', event => {
          const tag = event.target.tagName.toLowerCase();
          if (tag === 'a' || tag === 'summary') return;

          const coord = coordsByIndex.get(index);
          map.setView(coord, 15);
          markerByIndex.get(index)?.openPopup();
        });
      }

      els.results.appendChild(card);
    });

    if (map && markerLayer) {
      markerLayer.clearLayers();
      visible.forEach(index => {
        const marker = markerByIndex.get(index);
        if (marker) marker.addTo(markerLayer);
      });
    }
  }

  function initialiseDataUI() {
    if (typeof schools === 'undefined' || !Array.isArray(schools)) {
      els.count.textContent = 'School data did not load.';
      els.results.innerHTML =
        '<div class="error-box"><strong>The school data file did not load.</strong><br>Make sure schools.js is uploaded beside index.html in the GitHub repository.</div>';
      return false;
    }

    addOptions(els.area, schools.map(s => s.area));
    addOptions(els.delivery, schools.flatMap(s => s.delivery || []));
    addOptions(els.type, schools.map(s => s.type));

    [
      els.search, els.year, els.age, els.area, els.delivery, els.type
    ].forEach(el => el.addEventListener('input', renderResults));

    document.querySelectorAll('.pathways input').forEach(cb => {
      cb.addEventListener('change', renderResults);
    });

    document.getElementById('clear').addEventListener('click', () => {
      els.search.value = '';
      els.year.value = '';
      els.age.value = '';
      els.area.value = '';
      els.delivery.value = '';
      els.type.value = '';
      document.querySelectorAll('.pathways input').forEach(cb => cb.checked = false);
      renderResults();
    });

    renderResults();
    return true;
  }

  function cacheKeys(s) {
    const q = s.geocodeQuery || '';
    return [
      `seq-map:${q}`,
      `seq-map-v3:${q}`,
      `seq-map-v2:${q}`
    ];
  }

  function getCachedCoord(s) {
    try {
      for (const key of cacheKeys(s)) {
        const raw = localStorage.getItem(key);
        if (!raw) continue;

        const value = JSON.parse(raw);
        const coord = [Number(value.lat), Number(value.lon)];

        if (Number.isFinite(coord[0]) && Number.isFinite(coord[1])) {
          return coord;
        }
      }
    } catch (_) {}
    return null;
  }

  function saveCoord(s, coord) {
    try {
      localStorage.setItem(
        `seq-map:${s.geocodeQuery}`,
        JSON.stringify({ lat: coord[0], lon: coord[1] })
      );
    } catch (_) {}
  }

  function popupHtml(s) {
    return `
      <strong>${esc(s.name)}</strong>
      ${s.campus ? `<br>${esc(s.campus)}` : ''}
      ${yearText(s) ? `<br>${esc(yearText(s))}` : ''}
      ${s.address ? `<br>${esc(s.address)}` : ''}
    `;
  }

  function attachMarker(index, coord) {
    coordsByIndex.set(index, coord);
    const marker = L.marker(coord).bindPopup(popupHtml(schools[index]));
    markerByIndex.set(index, marker);
  }

  async function lookupAddress(s) {
    async function lookup(query) {
      const url =
        'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=au&q=' +
        encodeURIComponent(query);

      const response = await fetch(url, {
        headers: { 'Accept': 'application/json' }
      });

      if (!response.ok) return null;

      const data = await response.json();
      if (!data.length) return null;

      return [Number(data[0].lat), Number(data[0].lon)];
    }

    try {
      let coord = await lookup(s.geocodeQuery);
      if (!coord && s.fallbackQuery) coord = await lookup(s.fallbackQuery);
      return coord;
    } catch (_) {
      return null;
    }
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function initialiseMap() {
    if (typeof L === 'undefined') {
      els.mapStatus.textContent = 'Map library did not load. School results are still available below.';
      return;
    }

    map = L.map('map').setView([-27.62, 153.05], 9);
    markerLayer = L.layerGroup().addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const physical = [];
    schools.forEach((s, index) => {
      if (s.mappable !== false && s.geocodeQuery) physical.push(index);
    });

    let found = 0;
    const missing = [];

    physical.forEach(index => {
      const coord = getCachedCoord(schools[index]);
      if (coord) {
        attachMarker(index, coord);
        found++;
      } else {
        missing.push(index);
      }
    });

    renderResults();

    if (found) {
      const coords = [...coordsByIndex.values()];
      map.fitBounds(L.latLngBounds(coords), { padding: [20, 20] });
    }

    if (!missing.length) {
      els.mapStatus.textContent = `Map ready: ${found} pins loaded.`;
      setTimeout(() => els.mapStatus.style.display = 'none', 4000);
      return;
    }

    els.mapStatus.textContent =
      `Map ready with ${found} cached pins. Loading ${missing.length} remaining locations…`;

    for (let n = 0; n < missing.length; n++) {
      const index = missing[n];
      const coord = await lookupAddress(schools[index]);

      if (coord) {
        saveCoord(schools[index], coord);
        attachMarker(index, coord);
        found++;
        renderResults();
      }

      els.mapStatus.textContent =
        `Loading map locations ${n + 1}/${missing.length} · ${found} pins available`;

      await sleep(1200);
    }

    els.mapStatus.textContent = `Map ready: ${found} pins loaded.`;
    setTimeout(() => els.mapStatus.style.display = 'none', 5000);
  }

  document.getElementById('fit').addEventListener('click', () => {
    if (!map) return;

    const coords = visibleIndices()
      .filter(i => coordsByIndex.has(i))
      .map(i => coordsByIndex.get(i));

    if (coords.length) {
      map.fitBounds(L.latLngBounds(coords), { padding: [25, 25] });
    }
  });

  const dataReady = initialiseDataUI();

  if (dataReady) {
    const leafletScript = document.createElement('script');
    leafletScript.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    leafletScript.onload = initialiseMap;
    leafletScript.onerror = () => {
      els.mapStatus.textContent = 'Map could not load. School results are still available below.';
    };
    document.body.appendChild(leafletScript);
  }
})();
</script>
</body>
</html>
