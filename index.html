<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEQ School & Program Finder</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    header {
      padding: 18px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 88px);
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 18px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, select, button {
      width: 100%;
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    #resultCount {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    #map {
      min-height: calc(100vh - 88px);
      width: 100%;
    }

    .popup-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 7px;
    }

    .popup-row {
      margin: 4px 0;
    }

    .popup-link {
      display: inline-block;
      margin-top: 8px;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      #map {
        min-height: 68vh;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>SEQ School & Program Finder</h1>
    <p>Prototype — searchable and filterable map of schools and education programs.</p>
  </header>

  <div class="layout">
    <aside>
      <div class="field">
        <label for="search">Search</label>
        <input id="search" type="text" placeholder="School or program name" />
      </div>

      <div class="field">
        <label for="age">Age</label>
        <select id="age">
          <option value="">Any age</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="17">17</option>
          <option value="18">18</option>
        </select>
      </div>

      <div class="field">
        <label for="area">Area</label>
        <select id="area">
          <option value="">All areas</option>
          <option value="Logan">Logan</option>
        </select>
      </div>

      <div class="field">
        <label for="type">Program type</label>
        <select id="type">
          <option value="">All types</option>
          <option value="Adolescent Day Program">Adolescent Day Program</option>
        </select>
      </div>

      <button id="clearFilters" type="button">Clear filters</button>
      <div id="resultCount">1 matching location</div>
    </aside>

    <main id="map" aria-label="Map of schools and education programs"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="schools.js"></script>

  <script>
    const map = L.map("map").setView([-27.639, 153.110], 14);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markers = L.layerGroup().addTo(map);

    function popupHtml(school) {
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(school.address)}`;

      return `
        <div class="popup-title">${school.name}</div>
        <div class="popup-row"><strong>Ages:</strong> ${school.minAge}–${school.maxAge}</div>
        <div class="popup-row"><strong>Type:</strong> ${school.programType}</div>
        <div class="popup-row"><strong>Area:</strong> ${school.area}</div>
        <div class="popup-row"><strong>Address:</strong> ${school.address}</div>
        <div class="popup-row"><strong>Phone:</strong> ${school.phone}</div>
        <a class="popup-link" href="${mapsUrl}" target="_blank" rel="noopener noreferrer">
          Open in Google Maps
        </a>
      `;
    }

    function filteredSchools() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const age = document.getElementById("age").value;
      const area = document.getElementById("area").value;
      const type = document.getElementById("type").value;

      return schools.filter(school => {
        const matchesSearch =
          !q ||
          school.name.toLowerCase().includes(q) ||
          school.shortName.toLowerCase().includes(q);

        const matchesAge =
          !age ||
          (Number(age) >= school.minAge && Number(age) <= school.maxAge);

        const matchesArea =
          !area || school.area === area;

        const matchesType =
          !type || school.programType === type;

        return matchesSearch && matchesAge && matchesArea && matchesType;
      });
    }

    function render() {
      markers.clearLayers();

      const results = filteredSchools();

      results.forEach(school => {
        const marker = L.marker([school.lat, school.lng])
          .bindPopup(popupHtml(school));

        markers.addLayer(marker);
      });

      document.getElementById("resultCount").textContent =
        `${results.length} matching location${results.length === 1 ? "" : "s"}`;

      if (results.length === 1) {
        map.setView([results[0].lat, results[0].lng], 14);
      } else if (results.length > 1) {
        const bounds = L.latLngBounds(results.map(s => [s.lat, s.lng]));
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    }

    ["search", "age", "area", "type"].forEach(id => {
      document.getElementById(id).addEventListener("input", render);
    });

    document.getElementById("clearFilters").addEventListener("click", () => {
      document.getElementById("search").value = "";
      document.getElementById("age").value = "";
      document.getElementById("area").value = "";
      document.getElementById("type").value = "";
      render();
    });

    render();
  </script>
</body>
</html>
